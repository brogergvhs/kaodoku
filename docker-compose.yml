services:
  kaodoku:
    build: ${KAODOKU_BUILD_PATH}
    command:
      - serve
      - --addr
      - ${KAODOKU_ADDR}
      - --db
      - ${KAODOKU_DB_PATH}
    ports:
      - "${KAODOKU_HOST_PORT}:${KAODOKU_CONTAINER_PORT}"
    environment:
      XDG_CONFIG_HOME: ${XDG_CONFIG_HOME}
      KAODOKU_DOWNLOAD_DIR: ${KAODOKU_DOWNLOAD_DIR}
      KAODOKU_ADMIN_USER: ${KAODOKU_ADMIN_USER}
      KAODOKU_ADMIN_PASSWORD: ${KAODOKU_ADMIN_PASSWORD}
      KAODOKU_ENCRYPTION_KEY: ${KAODOKU_ENCRYPTION_KEY}
      KAODOKU_BROWSER_DOWNLOADER_ENABLED: ${KAODOKU_BROWSER_DOWNLOADER_ENABLED}
      KAODOKU_BROWSER_DOWNLOADER_ENDPOINT: ${KAODOKU_BROWSER_DOWNLOADER_ENDPOINT}
      KAODOKU_BROWSER_DOWNLOADER_TIMEOUT_SECONDS: ${KAODOKU_BROWSER_DOWNLOADER_TIMEOUT_SECONDS}
      KAODOKU_BROWSER_SOLVER_ENABLED: ${KAODOKU_BROWSER_SOLVER_ENABLED}
      KAODOKU_BROWSER_SOLVER_ENDPOINT: ${KAODOKU_BROWSER_SOLVER_ENDPOINT}
      KAODOKU_BROWSER_SOLVER_TIMEOUT_SECONDS: ${KAODOKU_BROWSER_SOLVER_TIMEOUT_SECONDS}
    networks:
      - default
      - arr_net
    volumes:
      - mangad-config:${XDG_CONFIG_HOME}
      - ${EXTERNALPATH}/Manga:/data
      - ${EXTERNALPATH}/Manga/Regular:${KAODOKU_DOWNLOAD_DIR}
    depends_on:
      browser-worker:
        condition: service_healthy

  selenium:
    image: ${SELENIUM_IMAGE}
    shm_size: ${SELENIUM_SHM_SIZE}
    environment:
      SE_NODE_MAX_SESSIONS: ${SE_NODE_MAX_SESSIONS}
      SE_NODE_OVERRIDE_MAX_SESSIONS: ${SE_NODE_OVERRIDE_MAX_SESSIONS}
    networks:
      - arr_net

  browser-worker:
    build: ${BROWSER_WORKER_BUILD_PATH}
    environment:
      SELENIUM_REMOTE_URL: ${SELENIUM_REMOTE_URL}
      BROWSER_WORKER_ADDR: ${BROWSER_WORKER_ADDR}
    networks:
      - arr_net
    depends_on:
      selenium:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:${BROWSER_WORKER_PORT}/health').read()"
      interval: ${BROWSER_WORKER_HEALTH_INTERVAL}
      timeout: ${BROWSER_WORKER_HEALTH_TIMEOUT}
      retries: ${BROWSER_WORKER_HEALTH_RETRIES}

networks:
  arr_net:
    external: true
    name: arr_net

volumes:
  mangad-config:
